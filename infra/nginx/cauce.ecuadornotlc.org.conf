# ============================================================
# Cloudflare Real IP — extraer IP real del visitante
# desde el header CF-Connecting-IP (no $remote_addr, que
# sería la IP del servidor Cloudflare con proxy activo).
# Mismo patrón que forms.quitosinmineria.org.
# ============================================================
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ============================================================
# HTTP — redirige a HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name cauce.ecuadornotlc.org;
    return 301 https://$server_name$request_uri;
}

# ============================================================
# HTTPS principal
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cauce.ecuadornotlc.org;

    ssl_certificate     /etc/letsencrypt/live/cauce.ecuadornotlc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cauce.ecuadornotlc.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_petition:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/cauce.access.log;
    error_log  /var/log/nginx/cauce.error.log;

    # ---- API FastAPI — rutas /api/ ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8011/;
        proxy_http_version 1.1;
        # Host header preservado — prerequisito para ruteo multi-dominio (Fase 1)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10M;
    }

    # ---- Frontend Next.js — todo lo demás ----
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        # Host header preservado — Next.js middleware lo usa para resolver campaña
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
