# ============================================================
# Nota: set_real_ip_from / real_ip_header CF-Connecting-IP
# ya están definidos globalmente en forms.quitosinmineria.org.conf
# (http context compartido). No se repiten aquí para evitar duplicado.
# ============================================================
# cache-lecturas-publicas (RK13): Cache-Control de la landing /c/<slug>. Next lo fija en no-store (la página es
# force-dynamic) y Cloudflare no guarda HTML sin una Cache Rule; nginx indica cuándo sí puede guardarse:
# solo respuestas 200 y sin query (?confirmada, ?nombre, ?completar=<token> son del visitante). 404, 5xx y
# cualquier query van con no-store.
# ============================================================
map "$upstream_status:$args" $cauce_landing_cache_control {
    default        "private, no-store";
    "~^200:$"      "public, s-maxage=10, stale-while-revalidate=5";
}

# ============================================================
# HTTP — redirige a HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name cauce.ecuadornotlc.org;
    return 301 https://$server_name$request_uri;
}

# ============================================================
# HTTPS principal
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cauce.ecuadornotlc.org;

    ssl_certificate     /etc/letsencrypt/live/cauce.ecuadornotlc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cauce.ecuadornotlc.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_petition:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/cauce.access.log;
    error_log  /var/log/nginx/cauce.error.log;

    # ---- API FastAPI — rutas /api/ ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8011/;
        proxy_http_version 1.1;
        # Host header preservado — prerequisito para ruteo multi-dominio (Fase 1)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10M;
    }

    # ---- Landing de campaña /c/<slug> (cacheable 10 s en el borde; ver el map de arriba) ----
    # Un add_header en location anula los del server: se repiten los de seguridad.
    location ~ ^/c/[^/]+/?$ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_hide_header  Cache-Control;
        add_header Cache-Control $cauce_landing_cache_control always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---- Frontend Next.js — todo lo demás ----
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        # Host header preservado — Next.js middleware lo usa para resolver campaña
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
