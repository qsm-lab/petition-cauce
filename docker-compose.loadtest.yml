# hardening-campana T4.1 — entorno AISLADO para pruebas de carga (no es dev ni producción).
# - Imagen y comando de producción de la API (uvicorn con 2 workers), BD y Redis propios y desechables.
# - SIN claves de correo: los envíos se registran en log (modo [dev]), no salen a ningún proveedor.
# - Red y puertos propios (API en 127.0.0.1:${LT_API_PORT:-8021}); no toca petition-*-dev ni petition-* de producción.
# Uso: ver loadtest/README.md
name: petition-loadtest

networks:
  loadtest_net:
    name: petition_loadtest_net

services:
  lt-db:
    image: postgres:16-alpine
    container_name: lt-db
    networks: [loadtest_net]
    environment:
      POSTGRES_USER: petition_admin
      POSTGRES_PASSWORD: loadtest-admin-pass
      POSTGRES_DB: petition_cause
      PETITION_APP_PASSWORD: loadtest-app-pass
    volumes:
      - ./database/init.sh:/docker-entrypoint-initdb.d/01_init.sh
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petition_admin -d petition_cause"]
      interval: 5s
      timeout: 5s
      retries: 10

  lt-redis:
    image: redis:7-alpine
    container_name: lt-redis
    networks: [loadtest_net]
    command: redis-server --maxmemory 384mb --maxmemory-policy volatile-lru
    mem_limit: 512m
    cpus: 0.5

  lt-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    container_name: lt-api
    networks: [loadtest_net]
    ports:
      - "127.0.0.1:${LT_API_PORT:-8021}:8000"
    env_file:
      - loadtest/loadtest.env
    mem_limit: 1536m
    cpus: 2.0
    depends_on:
      lt-db:
        condition: service_healthy
      lt-redis:
        condition: service_started
