name: Deploy petition-cauce to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Deploy al VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 20m — builds Next.js con assets de campaña pueden superar el timeout por defecto (10m)
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "→ Actualizando código desde GitHub..."
            git pull origin main

            echo "→ Construyendo imágenes Docker (con caché — solo reconstruye lo modificado)..."
            docker compose build

            echo "→ Aplicando migraciones de base de datos..."
            docker compose run --rm petition-api alembic upgrade head

            echo "→ Reiniciando servicios..."
            docker compose up -d --remove-orphans

            echo "→ Limpiando imágenes huérfanas..."
            docker image prune -f

            echo "→ Verificando salud del API..."
            sleep 5
            curl -f http://127.0.0.1:8011/health || echo "ADVERTENCIA: health check falló"

            echo "✓ Deploy petition-cauce completado"
